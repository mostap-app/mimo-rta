name: Android test APK
on:
  push:
    branches: [fix/android-standard-build-20261123]
    paths:
      - 'android/**'
      - '.github/workflows/android-test.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy offline resources and make camera/gallery inputs
        run: python3 android/prepare_assets.py
      - name: Build signed debug APK with official Android Gradle Plugin
        run: cd android && gradle --no-daemon assembleDebug
      - name: Verify APK with Android apksigner
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: Mimo-rta-Android-standard-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
