function logWeight(w){S.weights=S.weights||[];const d=curDay();const x=S.weights.find(v=>v.d===dk());if(x)x.w=w;else S.weights.push({d:dk(),w});S.weights.sort((a,b)=>a.d<b.d?-1:1)}
function curW(){const L=S.weights||[];return L.length?L[L.length-1].w:(S.profile?S.profile.w:0)}
function forecast(){const p=S.profile;if(!p||p.goal===1||!p.tw)return null;const cur=curW(),left=p.tw-cur;
  if((p.goal===0&&left>=0)||(p.goal===2&&left<=0))return {done:true,left:0};
  const rate=p.goal===0?0.5:0.35,weeks=Math.abs(left)/rate,d=new Date();d.setDate(d.getDate()+Math.ceil(weeks*7));
  const span=Math.abs(p.tw-(p.w0||p.w))||1;return {date:d,weeks,left,pct:Math.max(0,Math.min(100,Math.round((1-Math.abs(left)/span)*100)))}}

function goalCard(){const p=S.profile;if(!p)return"";if(p.goal!==1&&!p.tw)return `<button class="sheet goalc gset" data-go="setup"><span><b>Когда вы будете у цели?</b><span class="kcal">Укажите желаемый вес, и приложение посчитает дату</span></span><span class="wbtn">Указать</span></button>`;const f=forecast(),cw=curW();

  ${f&&!f.done?`<div class="gbar"><i style="width:${f.pct}%"></i></div>`:""}</div>`}

function weightChart(){const L=S.weights||[];if(L.length<2)return S.profile?`<div class="sheet"><h2>Вес</h2><p class="note">Запишите вес ещё раз через неделю, и здесь появится график.</p><button class="ghost" data-go="weight">+ Записать вес</button></div>`:"";

async function recognize(img,st){

function parseSay(text){
  if(!FW||FW.length!==FOODS.length)FW=FOODS.map(f=>wordsOf(f[0]).filter(w=>w.length>1&&!/^\d/.test(w)&&!STOPW.has(w)));
  const segs=nz(text).replace(/(\d),(\d)/g,"$1.$2").split(/[,;.\n]|\s+и\s+|\s+плюс\s+|\s+потом\s+|\s+ещ[её]\s+|\s+а также\s+/).map(x=>x.trim()).filter(Boolean);

    FW.forEach((fw,i)=>{if(!fw.length)return;let sc=0,hit=0,first=0;fw.forEach((w,k)=>{const m=Math.max(...cw.map(c=>wMatch(c,w)));if(m){sc+=m;hit++;if(k===0)first=m}});

}

function parseLabel(raw){
  let t=raw.toLowerCase().replace(/\s+/g," ").replace(/(\d) ?, ?(\d)/g,"$1.$2");
  t=t.replace(/kcal|ккал|kкал|ккaл|kkал|kkal|ккал\./g,"ккал").replace(/kj|кдж|kдж|кдж\./g,"кдж");
  const ok=v=>v>0&&v<=950;let k=0,m;
  const re=/(\d{1,4}(?:\.\d+)?)\s*ккал/g;
  while((m=re.exec(t))){if(ok(+m[1])){k=+m[1];break}}
  if(!k&&(m=t.match(/кдж\s*[\/|]\s*ккал[^\d]{0,30}(\d{2,4}(?:\.\d+)?)\s*[\/|]\s*(\d{1,4}(?:\.\d+)?)/))&&ok(+m[2]))k=+m[2];
  if(!k&&(m=t.match(/ккал[^\d]{0,30}(\d{1,4}(?:\.\d+)?)/))&&ok(+m[1]))k=+m[1];
  if(!k&&(m=t.match(/(\d{2,4})\s*кдж/))&&ok(+m[1]/4.184))k=+m[1]/4.184;
  if(!k){const num=re=>{const m=t.match(re);return m?+m[1]:NaN};
    const P=num(/белк[а-я]*[^\d]{0,12}(\d{1,2}(?:\.\d+)?)/),F=num(/жир[а-я]*[^\d]{0,12}(\d{1,2}(?:\.\d+)?)/),C=num(/углевод[а-я]*[^\d]{0,12}(\d{1,2}(?:\.\d+)?)/);
    if(!isNaN(P)&&!isNaN(F)&&!isNaN(C)){const v=4*P+9*F+4*C;if(ok(v))k=v}}
  let g=0;const gm=t.match(/(?:масса нетто|нетто|объ[её]м|масса)[^\d]{0,20}(\d+(?:\.\d+)?\s*(?:кг|гр|г|мл|л))/);if(gm)g=parseQty(gm[1]);
  const bad=/ценност|состав|белк|жир|углев|масс|срок|хран|изготов|ккал|кдж|гост|ту /;
  const n=(raw.split(/\n/).map(x=>x.trim()).find(x=>x.length>=6&&x.length<=45&&/^[А-ЯЁа-яё]/.test(x)&&(x.match(/[А-ЯЁа-яё]{3,}/g)||[]).length>=2&&!bad.test(x.toLowerCase()))||"").replace(/[^А-ЯЁа-яё0-9 ,.%«»"-]/g,"").trim();
  return {k100:k?Math.round(k):0,g,n};
}
async function readLabel(img,st){
  await loadScript("scan/tesseract.min.js");
  if(!ocrW){
    st("Читаю этикетку… Первый раз загружаю распознавание текста (~7 МБ), дальше будет быстрее");
    const base=new URL("scan/",location.href).href;
    ocrW=await Tesseract.createWorker("rus",1,{workerPath:base+"worker.min.js",corePath:base,langPath:base.replace(/\/$/,""),gzip:true});
  }
  st("Читаю этикетку…");
  const {data}=await ocrW.recognize(toCanvas(img,2000),{},{text:true,blocks:true});
  const r=parseLabel(data.text||"");r.n=guessName(data);
  if(!r.k100){
    st("Читаю этикетку ещё раз, внимательнее…");
    const d2=(await ocrW.recognize(contrast(toCanvas(img,2800)))).data;
    const r2=parseLabel((d2.text||"")+"\n"+(data.text||""));if(r2.k100)r.k100=r2.k100;if(!r.g)r.g=r2.g;
  }
  return r;
}
async function startScan(file){
  goal("scan");
  if(tab!=="add"){const hr=new Date().getHours();addMeal=hr<11?0:hr<16?1:hr<21?2:3}
  if(scan&&scan.url)URL.revokeObjectURL(scan.url);
  scan={url:URL.createObjectURL(file),status:"Ищу штрихкод…",n:"",k100:"",g:100,src:"",code:""};pick=null;go("scan");
  const st=t=>{scan.status=t;if(tab==="scan")renderScan()};
  try{
    const img=new Image();img.src=scan.url;await img.decode();
    await loadScript("scan/zxing.min.js").catch(()=>{});
    const code=readBarcode(toCanvas(img,1600))||readBarcode(toCanvas(img,900));
    if(code){
      scan.code=code;
      const mine=(S.my||[]).find(x=>x.code===code);
      if(mine){Object.assign(scan,{n:mine.n,k100:mine.k100,g:mine.g||100,src:"Этот продукт вы уже добавляли, данные подставлены."});return st("")}
      st("Штрихкод "+code+". Ищу продукт в базе…");
      const p=await offLookup(code).catch(()=>null);
      if(p&&p.k100){Object.assign(scan,p,{src:"Нашли по штрихкоду в базе продуктов. Проверьте граммы."});return st("")}
      if(p&&p.n){scan.n=p.n;scan.g=p.g}
    }
    st(code?"Продукта нет в базе. Читаю этикетку…":"Штрихкод не нашёл. Читаю этикетку…");
    const r=await readLabel(img,st);
    if(r.k100){scan.k100=r.k100;scan.src="Прочитали калорийность с этикетки. Сверьте цифру с упаковкой."}
    else scan.src="Не смог прочитать калорийность. Впишите её с упаковки, и в следующий раз этот продукт найдётся сам.";
    if(r.g&&!code)scan.g=r.g;if(r.n&&!scan.n)scan.n=r.n;
  }catch(e){scan.src="Не получилось распознать ("+(e.message||e)+"). Впишите данные с упаковки."}
  st("");
}

const FOOD_WORDS="паст макарон спагет лапш рамен удон йогурт кефир молок творог сыр сырок орех арахис миндал фундук кешью фисташ семечк хлеб батон багет лаваш тортил печень шоколад конфет батончик вафл пряник зефир мармелад халв сок нектар вод чай кофе какао напит лимонад квас морс компот смузи коктейл ряженк снежок айран простокваш сливк сметан масл майонез кетчуп соус колбас сосиск сардельк ветчин бекон грудинк курин куриц цыпл индейк говядин свинин телятин баранин мяс фарш котлет тефтел фрикадел наггетс рыб тунец тунц лосос сёмг семг форел сельд скумбри кальмар кревет икр крабов паштет хумус брынз моцарел пармезан фета салат суп борщ щи солянк каш гречк рис овсян хлоп мюсли гранол плов пельмен вареник блин сырник омлет яйц торт пирож пирог булочк круассан кекс маффин мороженое пломбир десерт пудинг мёд мед варень джем повидл фрукт яблок груш банан апельсин мандарин ягод клубник малин вишн черник овощ томат помидор огур картоф чипс сухар крекер хлебц пицц бургер сэндвич ролл шаурм нут фасол чечевиц горох кукуруз гриб шампиньон капуст морков свекл тыкв кабач баклажан оливк маслин изюм кураг финик чернослив булгур кускус киноа перловк пшен манк протеин гейнер".split(" ");
function hasFood(t){t=t.toLowerCase();return FOOD_WORDS.some(w=>new RegExp("(^|[^а-яё])"+w).test(t))}
function niceCase(t){return t===t.toUpperCase()?t.charAt(0)+t.slice(1).toLowerCase():t}
function guessName(data){
  // Название ставим, только если в крупной чёткой строке есть слово про еду. Иначе поле пустое: лучше пусто, чем мусор.
  const bad=/ценност|состав|белк|жир|углев|масс|срок|хран|изготов|ккал|кдж|гост|претенз|адрес|вернём|продукт готов|число|месяц|рекоменд|разогре|упаков|изделия|блюда/i;
  const lines=[];(data.blocks||[]).forEach(b=>(b.paragraphs||[]).forEach(p=>(p.lines||[]).forEach(l=>lines.push(l))));
  const clean=l=>{const seg=[];for(const w of l.words||[]){if(/[|]/.test(w.text)&&seg.length)break;const t=w.text.replace(/[^А-ЯЁа-яё0-9%,.-]/g,"");if(w.confidence>=60&&/[А-ЯЁа-яё]{3,}/.test(t))seg.push(t);else if(seg.length)break}return seg.join(" ")};
  const hs=lines.map(l=>l.bbox.y1-l.bbox.y0).sort((a,b)=>a-b),med=hs[hs.length>>1]||1;
  let best=null,bi=-1;
  lines.forEach((l,i)=>{if(l.confidence<55||bad.test(l.text))return;const t=clean(l);if(t.length<3||!hasFood(t))return;
    const h=l.bbox.y1-l.bbox.y0,sc=h/med+(t.length<=40?1:0);if(!best||sc>best.sc){best={t,h,sc};bi=i}});
  if(!best)return"";
  const nx=lines[bi+1];if(nx&&nx.confidence>=55&&!bad.test(nx.text)){const h=nx.bbox.y1-nx.bbox.y0,t=clean(nx);if(t&&h>=best.h*0.7&&(best.t+" "+t).length<=45)best.t+=" "+t}
  let n=niceCase(best.t.replace(/[,.-]+$/,"").trim());
  return n.length>45?n.slice(0,45).replace(/\s\S*$/,""):n;
}

function mapSVG(pr){
  // маршрут объезжает точку «Вы», как в логотипе
  const pts=[[20,120],[90,120],[120,190],[250,190],[280,120],[350,120]];
  const seg=[];let L=0;for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);L+=d}
  let t=Math.min(pr/.97,1)*L,x=pts[0][0],y=pts[0][1];
  for(let i=0;i<seg.length;i++){if(t<=seg[i]){const f=t/seg[i];x=pts[i][0]+(pts[i+1][0]-pts[i][0])*f;y=pts[i][1]+(pts[i+1][1]-pts[i][1])*f;break}t-=seg[i];x=pts[i+1][0];y=pts[i+1][1]}
  const path="M"+pts.map(p=>p.join(" ")).join(" L");
  const blocks=[[20,20,80,70],[130,10,90,40],[250,20,90,70],[10,150,80,60],[290,150,70,60]];
  return `<svg viewBox="0 0 370 220" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Карта: курьер едет в объезд">
   ${blocks.map(b=>`<rect x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" rx="8" fill="var(--bg)"/>`).join("")}
   <path d="${path}" fill="none" stroke="var(--line)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
   <path d="${path}" fill="none" stroke="var(--route)" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round" stroke-linejoin="round"/>
   <circle cx="185" cy="110" r="26" fill="none" stroke="var(--ring)" stroke-width="10"/><text x="185" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">Вы</text>
   <circle cx="20" cy="120" r="9" fill="var(--warm)"/>
   <circle cx="${x}" cy="${y}" r="15" fill="var(--warm)" opacity=".3"/><circle cx="${x}" cy="${y}" r="9" fill="var(--warm)"/>
  </svg>`;
}

   </div>
   <div class="sheet"><h2>Неделя</h2>
     <div class="week">${days.map(x=>`<div class="wd"><span class="muted">${x.w}</span><div class="bar" aria-hidden="true"><i class="${x.e>N?"o":""}" style="width:${(x.e/max*100).toFixed(1)}%"></i><i class="m" style="width:${(x.m/max*100).toFixed(1)}%"></i></div><span>${x.e||x.m?`${fmt(x.e)}${x.m?` / <span style="color:var(--save-text)">−${fmt(x.m)}</span>`:""}`:`<span class="muted">—</span>`}</span></div>`).join("")}</div>
     <div class="legend"><span style="--c:var(--ink)">Съедено</span><span style="--c:var(--accent)">Сверх нормы</span><span style="--c:var(--save)">Мимо рта</span></div>
   </div>
   ${weightChart()}
   <div class="sheet"><div class="tot"><span class="muted">Дневная норма</span><span>${fmt(N)} ккал</span></div><button class="ghost" data-go="setup">${S.profile?"Изменить данные":"Рассчитать норму"}</button></div>
   <div class="two"><button class="ghost" id="backup">Сохранить копию</button><label class="ghost restore">Восстановить<input type="file" accept=".json,application/json" id="restoreIn" hidden></label></div>
   <p class="note">Данные хранятся только в этом телефоне. Раз в неделю сохраняйте копию в «Файлы», чтобы ничего не потерять.</p>
   <button class="ghost" id="reset">Сбросить все данные</button>
   <p class="fineprint">Распознавание еды: MobileCLIP-S0 (Apple), <a href="MOBILECLIP_LICENSE.txt" target="_blank" rel="noopener">лицензия</a>. Фото блюд созданы ИИ.</p>`;
}

/* ---------- События ---------- */
document.addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
  if(e.target.id==="restoreIn"){f.text().then(t=>{const d=JSON.parse(t);if(!d||!d.log||!d.days)throw 0;S=Object.assign(load(),d);order=S.active||null;save();toast("Данные восстановлены");go("diary")}).catch(()=>toast("Это не файл копии «Мимо рта»"));e.target.value="";return}if(e.target.id==="photoIn")startPhoto(f);if(e.target.id==="scanIn")startScan(f);e.target.value=""});
document.addEventListener("input",e=>{
  if(e.target.id==="pq"&&photo){photo.q=e.target.value;$("#pres").innerHTML=photoFind();return}
  if(e.target.dataset.pg!==undefined&&photo){const k=+e.target.dataset.pg,x=photo.sel[k];x.g=+e.target.value||0;$("#pk"+k).textContent=fmt(FOODS[x.i][1]*x.g/100)+" ккал";return photoCta()}
  if(e.target.id==="goal"&&$("#twF")){const g=+e.target.value,w=+$("#w").value||70;$("#twF").hidden=g===1;$("#tw").value=g===2?w+5:w-5}
  if(e.target.id==="sayT"){sayText=e.target.value;return}
  if(e.target.id==="q"){q=e.target.value;$("#res").innerHTML=foodRows()}
  if((e.target.id==="grams"||e.target.id==="k100")&&$("#kc")){$("#kc").textContent=fmt((+$("#k100").value||0)*(+$("#grams").value||0)/100)+" ккал"}
});
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.re){const x=recents()[+b.dataset.re];if(!x)return;const day=curDay();(S.log[day]=S.log[day]||[]).push({n:x.n,k:x.k,g:x.g||0,m:addMeal,k100:x.k100||0});goal("add_food");markDay();save();toast("Записано: "+x.n);return go("diary")}
  if(b.id==="saveW"){const w=+$("#wNow").value;if(!(w>30&&w<300))return toast("Проверьте вес");logWeight(w);goal("weight");save();const f=forecast();toast(f&&f.done?"Цель достигнута! 🎉":f?`Записано. Цель ${fmt1(S.profile.tw)} кг к ${fdate(f.date)}`:"Записано");return go("diary")}
  if(b.id==="sayMic")return sayMic();
  if(b.id==="sayGo")return saySubmit();
  if(b.dataset.ptog){const x=photo.sel[+b.dataset.ptog];x.on=!x.on;$("#prows").innerHTML=photoRows();return photoCta()}
  if(b.dataset.padd){photo.sel.push({i:+b.dataset.padd,g:FOODS[+b.dataset.padd][2],on:true});photo.q="";$("#pq").value="";$("#pres").innerHTML="";$("#prows").innerHTML=photoRows();return photoCta()}
  if(b.id==="addPhoto"){const L=photo.sel.filter(x=>x.on&&x.g>0);if(!L.length)return toast("Отметьте хотя бы одно блюдо");addMeal=+$("#ml").value;const day=curDay();S.log[day]=S.log[day]||[];
    L.forEach(x=>{const f=FOODS[x.i];S.log[day].push({n:f[0],k:Math.round(f[1]*x.g/100),g:x.g,m:addMeal,k100:f[1]})});goal("add_food");markDay();save();pick=null;q="";toast(`Записано: ${L.length} ${plural(L.length,"блюдо","блюда","блюд")}`);return go("diary")}
  if(b.dataset.crave){goal("crave_tile");const id=b.dataset.crave;if(!cart[id])cart[id]=1;return go(order?"track":"cart")}
  if(b.dataset.cat){cat=b.dataset.cat;return render()}
  if(b.dataset.add){cart[b.dataset.add]=(cart[b.dataset.add]||0)+1;if(tab==="menu")toast("Добавлено. Аппетит растёт, вес нет.");return render()}
  if(b.dataset.dec){if(--cart[b.dataset.dec]<=0)delete cart[b.dataset.dec];return render()}
  if(b.dataset.tab){return go(b.dataset.tab==="menu"&&order?"track":b.dataset.tab)}
  if(b.dataset.go){return go(b.dataset.go==="menu"&&order?"track":b.dataset.go)}
  if(b.dataset.addmeal){addMeal=+b.dataset.addmeal;pick=null;q="";return go("add")}
  if(b.dataset.pick){pick=b.dataset.pick==="custom"?"custom":+b.dataset.pick;return go("add")}
  if(b.dataset.back){pick=null;return go("add")}
  if(b.dataset.g){const g=$("#grams");g.value=b.dataset.g;g.dispatchEvent(new Event("input",{bubbles:true}));return}
  if(b.dataset.del){const day=curDay(),i=+b.dataset.del,[x]=S.log[day].splice(i,1);save();render();undo=()=>{S.log[day].splice(i,0,x);save();render()};return toast(`Удалено: ${x.n}`,true)}
  if(b.id==="undo"){const f=undo;undo=null;$("#toast").hidden=true;if(f)f();return}
  if(b.dataset.day){const d=new Date((viewDay||dk())+"T12:00:00");d.setDate(d.getDate()+(+b.dataset.day));const k=dk(d);viewDay=k>=dk()?null:k;return render()}
  if((b.id==="addFood"||b.id==="addScan"||b.id==="addCustom")&&$("#ml"))addMeal=+$("#ml").value;
  if(b.id==="addFood"){const f=FOODS[pick];const g=+$("#grams").value||0,k1=+$("#k100").value||0;if(g<=0)return toast("Укажите граммы");if(k1<=0)return toast("Укажите калории на 100 г");if(k1!==f[1]){S.kfix=S.kfix||{};S.kfix[f[0]]=k1;f[1]=k1}return addEntry(f[0],k1*g/100,g,k1)}
  if(b.id==="addScan"){const n=$("#fn").value.trim()||"Продукт",k1=+$("#k100").value||0,g=+$("#grams").value||0;if(k1<=0)return toast("Укажите калории на 100 г");if(g<=0)return toast("Укажите граммы");rememberFood(n,k1,g,scan&&scan.code);return addEntry(n,k1*g/100,g,k1)}
  if(b.dataset.edit){editIdx=+b.dataset.edit;return go("entry")}
  if(b.id==="saveEntry"){const e=S.log[curDay()][editIdx];e.n=$("#fn").value.trim()||e.n;e.m=+$("#em").value;
    if(e.g){const k1=+$("#k100").value||0,g=+$("#grams").value||0;if(k1<=0||g<=0)return toast("Проверьте калории и граммы");e.k100=k1;e.g=g;e.k=Math.round(k1*g/100)}
    else{const k=+$("#ck").value||0;if(k<=0)return toast("Укажите калории");e.k=Math.round(k)}
    save();toast("Сохранено");return go("diary")}
  if(b.id==="delEntry"){const day=curDay(),i=editIdx,[x]=S.log[day].splice(i,1);save();go("diary");undo=()=>{S.log[day].splice(i,0,x);save();render()};return toast(`Удалено: ${x.n}`,true)}
  if(b.id==="addCustom"){const n=$("#cn").value.trim()||"Своё блюдо";const k=+$("#ck").value||0;if(k<=0)return toast("Укажите калории");return addEntry(n,k,0)}
  if(b.id==="saveProfile"){
    const sex=$("#sex").value,age=+$("#age").value,h=+$("#h").value,w=+$("#w").value,act=+$("#act").value,goal=+$("#goal").value;
    if(!(age>10&&h>100&&w>30))return toast("Проверьте возраст, рост и вес");
    const bmr=10*w+6.25*h-5*age+(sex==="m"?5:-161);
    const n=Math.max(sex==="m"?1500:1200,Math.round((bmr*ACT[act][1]+GOALS[goal][1])/10)*10);
    let tw=goal===1?w:+$("#tw").value;if(goal!==1&&!(tw>30&&tw<300))return toast("Укажите желаемый вес");
    if(goal===0&&tw>=w)return toast("Для похудения желаемый вес должен быть меньше текущего");if(goal===2&&tw<=w)return toast("Для набора желаемый вес должен быть больше текущего");
    const first=!S.profile;S.profile={sex,age,h,w,act,goal,norm:n,tw,w0:(S.profile&&S.profile.w0)||w};logWeight(w);save();return go(first||goal!==1?"plan":"diary");
  }
  if(b.id==="skipProfile"){S.profile={sex:"f",age:35,h:168,w:75,act:1,goal:0,norm:2000};save();return go("diary")}
  if(b.id==="streak"){const n=streak();return toast(`Вы ${n} ${plural(n,"день","дня","дней")} подряд ведёте дневник. Кто записывает еду каждый день, худеет заметно успешнее. Не прерывайте серию!`)}
  if(b.id==="backup"){const blob=new Blob([JSON.stringify(S)],{type:"application/json"}),name=`mimo-rta-${dk()}.json`,file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]}))return navigator.share({files:[file]}).catch(()=>{});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();return}
  if(b.id==="cartBtn")return go("cart");
  if(b.id==="checkout")return startOrder();
  if(b.id==="skip"){order.start=Date.now()-TRIP_SEC*1000*.9;S.active=order;save();return render()}
  if(b.id==="reset"){if(b.dataset.sure){S={profile:null,log:{},orders:[],days:[],active:null};order=null;save();return go("setup")}b.dataset.sure=1;b.textContent="Нажмите ещё раз, чтобы стереть всё";}
});

setInterval(()=>{
  if(!order)return;
  if(progress()>=1){finishOrder();return}
  if(tab==="track")renderTrack();
},1000);

if(order)tab="track";else if(!S.profile)tab="setup";
render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>

</body></html>
