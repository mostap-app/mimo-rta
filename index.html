.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.quick button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;min-height:40px}
.bigk{font-family:var(--display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:14px}
.week{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;margin-top:8px;font-size:13px;font-variant-numeric:tabular-nums}
.week th,.week td{padding:2px 6px;text-align:left;vertical-align:middle}
.week thead th{padding-block:8px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.week thead th:first-child{width:29%}
.week thead th:last-child{width:27%}
.week td:last-child,.week thead th:last-child{text-align:right}
.week tbody{line-height:1.25}
.week tbody tr{height:50px}
.week tbody tr:not(:last-child)>*{border-bottom:1px solid var(--line)}
.week th[scope=row]{font-weight:500;white-space:nowrap}
.week time{display:block;color:var(--muted);font-size:12px}
.week .week-today>*{background:var(--bg)}
.week-today th{border-radius:10px 0 0 10px}
.week-today td:last-child{border-radius:0 10px 10px 0}
.week-amount{display:flex;justify-content:space-between;gap:2px 4px;flex-wrap:wrap;overflow-wrap:anywhere}
.week-over{color:var(--accent-text);font-weight:700}
.week-saved{color:var(--save-text);font-weight:700;overflow-wrap:anywhere;text-align:right}
.week-empty{color:var(--muted);font-size:12px;font-weight:400}
.week-track{position:absolute;inset:auto 0 4px;display:flex;height:5px;border-radius:6px;background:var(--line);overflow:hidden}
.week-track i{height:100%;background:var(--ink)}
.week-track .week-over{background:var(--accent)}
.week-track::after{content:"";position:absolute;inset:0 auto 0 var(--week-limit);border-left:2px dashed var(--muted);box-shadow:1px 0 var(--surface)}
.week-key{display:flex;gap:4px 14px;flex-wrap:wrap;margin-top:4px;color:var(--muted);font-size:12px}
.week-key span{display:flex;gap:6px;align-items:center}
.week-key span::before{content:"";flex:none}
.week-key .week-reference::before{height:11px;border-left:2px dashed var(--muted)}
.week-key .week-excess::before{width:9px;height:9px;border-radius:3px;background:var(--accent)}
.week-note{margin-top:5px}
.photo-btn{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border-radius:18px;border:1.5px dashed var(--line);background:var(--surface);font-weight:700;cursor:pointer;min-height:52px}
.photo-btn svg{width:22px;height:22px}
.photo-btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.shot{width:100%;max-height:300px;object-fit:cover;border-radius:20px;margin-top:12px;display:block;background:var(--plate)}
.status{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--muted);font-weight:600}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.guess button{display:flex;justify-content:space-between;align-items:center;width:100%;gap:10px;text-align:left;padding:14px 0;border-bottom:1px solid var(--line);min-height:52px}
.guess button:last-child{border-bottom:0}
.guess b{font-weight:600}
.pct{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;color:var(--save-text);flex:none}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
  #courierMarker{display:none}
}

/* Shared visual rules: onboarding, diary, search, craving, help and navigation. */
:root{--support-surface:#E2F0E6;--craving-surface:#FFF1E9;--craving-ink:#923F32}
::selection{background:#DCEBDD;color:var(--ink)}
button,.sheet,.chip,.dish,.kpi,.wbtn{transition:background-color .16s ease,border-color .16s ease,color .16s ease}
nav.tabs button[aria-current="true"]{color:var(--save-text)}
nav.tabs button[aria-current="true"] svg{stroke:currentColor}
.crave2.hero{border-color:#F77E6B}
.crave2.hero .cta,.diary-crave .cta{background:#D95E4B;color:#fff}
button.crave{box-shadow:0 8px 24px -16px rgba(171,67,52,.4)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline-color:#416F53}
@media(prefers-reduced-motion:reduce){button,.sheet,.chip,.dish,.kpi,.wbtn{transition:none}}

const goalsInFlight=new Set();

function pilotState(){
  try{
    const x=JSON.parse(localStorage.getItem(PILOT_KEY));
    if(x&&typeof x.day==="string"&&x.goals&&typeof x.goals==="object")return x;
  }catch(e){}
  return null;
}

function trackPilotGoal(name,firstVisit=false){
  if(!METRIKA_ID)return;
  try{
    const p=pilotState()||(firstVisit?{day:dk(),goals:{}}:null);
    if(!p)return;
    if(p.goals[name]===undefined){
      p.goals[name]=false;
      localStorage.setItem(PILOT_KEY,JSON.stringify(p));
    }
    syncPilotGoals();
  }catch(e){}
}

function syncPilotGoals(){
  if(!METRIKA_ID||!window.ym||navigator.onLine===false)return;
  const p=pilotState();
  if(!p)return;
  for(const name of PILOT_GOALS){
    if(p.goals[name]!==false||goalsInFlight.has(name))continue;
    goalsInFlight.add(name);
    try{
      ym(METRIKA_ID,"reachGoal",name,{},()=>{
        try{
          const latest=pilotState();
          if(latest?.day===p.day){
            latest.goals[name]=true;
            localStorage.setItem(PILOT_KEY,JSON.stringify(latest));
          }
        }catch(e){}finally{goalsInFlight.delete(name)}
      });
    }catch(e){goalsInFlight.delete(name)}
  }
}

function trackPilotVisit(){
  if(document.visibilityState==="hidden")return;
  const p=pilotState();
  if(p){
    const days=(Date.parse(dk())-Date.parse(p.day))/86400000;
    if(days===1||days===7)trackPilotGoal("return_d"+days);
    else syncPilotGoals();

}

  if(!obj(s))throw new Error("Некорректная копия");
  const {log=legacy?{}:undefined,days=legacy?[]:undefined,orders=[],profile:p=null,active:a=null,lastReward,weights,water,cup,my,kfix,hello}=s;
  if(!dict(log,x=>list(x,record),date)||!list(days,date)||!list(orders,done)||
     (p!==null&&!profile(p))||(a!==null&&!active(a))||
     (lastReward!=null&&(!sums(lastReward)||!str(lastReward.excuse)))||
     (weights!==undefined&&!list(weights,x=>obj(x)&&date(x.d)&&pos(x.w)))||
     (water!==undefined&&!dict(water,num,date))||(cup!==undefined&&!pos(cup))||
     (my!==undefined&&!list(my,x=>obj(x)&&str(x.n)&&pos(x.k100)&&num(x.g)&&(x.code===undefined||str(x.code))))||
     (kfix!==undefined&&!dict(kfix,pos))||(hello!==undefined&&hello!==1)){
    throw new Error("Некорректная копия");
  }
  const result={profile:p,log,orders:orders.map(o=>({...o,day:o.day||dk(new Date(o.d))})),days,active:a};
  if(s.skippedProfile===true)result.skippedProfile=true;
  for(const [k,v] of Object.entries({lastReward,weights,water,cup,my,kfix,hello}))if(v!==undefined)result[k]=v;
  return result;
}

function load(){
  try{
    storedDiary=localStorage.getItem(DIARY_KEY);
    if(storedDiary!==null)return parseDiary(storedDiary);
    const old=localStorage.getItem("sytglazami");
    return old===null?emptyDiary():parseDiary(old,true);
  }catch(e){
    unreadableDiary=storedDiary!==null&&storedDiary!==undefined;
    storageMessage=unreadableDiary?"Дневник не открылся. Сохраните исходную копию или восстановите данные из исправной копии.":"Не удалось открыть хранилище дневника. Разрешите хранение данных в браузере и повторите запись.";
    return emptyDiary();
  }
}

function showStorageMessage(message=storageMessage){
  storageMessage=message;
  $("#storageMessage").textContent=message;
  $("#storageWarning").hidden=!message;
  $("#retrySave").hidden=unreadableDiary;
  $("#emergencyBackup").textContent=unreadableDiary?"Сохранить исходную копию":"Сохранить копию";
}

function save(data=S,restore=false){
  storageRevision++;
  if(unreadableDiary&&!restore)return false;
  try{
    const current=localStorage.getItem(DIARY_KEY);
    if(current!==(storedDiary??null)){
      showStorageMessage("Дневник изменился в другой вкладке. Сохраните копию с этой вкладки, затем обновите страницу.");
      return false;
    }
    const json=JSON.stringify(data);
    localStorage.setItem(DIARY_KEY,json);
    storedDiary=json;
    unreadableDiary=false;
    showStorageMessage("");
    return true;
  }catch(e){
    showStorageMessage(restore?"Не удалось записать копию. Текущий дневник сохранён.":"Изменения пока только на этом экране. Повторите запись или сохраните копию перед закрытием.");
    return false;
  }
}

async function restoreDiary(file){
  const revision=++storageRevision;
  let next;
  try{next=parseDiary(await file.text())}
  catch(e){if(revision===storageRevision)toast("Не удалось прочитать копию «Мимо рта». Дневник не изменён.");return}
  if(revision!==storageRevision){toast("Дневник уже изменился. Выберите файл копии ещё раз.");return}
  if(!save(next,true))return;
  S=next;cart={};order=S.active;undo=null;viewDay=null;editIdx=null;
  applyFoodHistory();
  toast("Данные восстановлены");
  go(order?"track":"diary");
}

async function downloadDiary(json){
  const name=`mimo-rta-${dk()}.json`, blob=new Blob([json],{type:"application/json"});
  const file=new File([blob],name,{type:blob.type});
  try{
    if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file]});return}
  }catch(e){if(e.name==="AbortError")return}
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function upsertFood(n,k100,g){const f=FOODS.find(x=>x[0]===n);if(f){f[1]=k100;f[2]=g||f[2]}else FOODS.push([n,k100,g||100])}
function rememberFood(n,k100,g,code){
  S.my=S.my||[];const i=S.my.findIndex(x=>(code&&x.code===code)||x.n===n);const it={n,k100,g,code:code||""};
  if(i>=0)S.my[i]=it;else S.my.push(it);upsertFood(n,k100,g);
}
const originalFood=FOODS.map(f=>f.slice(1));
function applyFoodHistory(){
  FOODS.length=BASE_N;
  originalFood.forEach(([k,g],i)=>{FOODS[i][1]=k;FOODS[i][2]=g});
  (S.my||[]).forEach(x=>upsertFood(x.n,x.k100,x.g));
  Object.entries(S.kfix||{}).forEach(([n,k])=>{const f=FOODS.find(x=>x[0]===n);if(f)f[1]=k});
}
applyFoodHistory();
const loadScript=(()=>{const c={};return src=>c[src]||(c[src]=new Promise((ok,no)=>{const el=document.createElement("script");el.src=src;el.onload=ok;el.onerror=()=>{delete c[src];no(new Error("Нет связи, не загрузилось распознавание"))};document.head.appendChild(el)}))})();
function toCanvas(img,max){const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c}
function contrast(c){const x=c.getContext("2d"),im=x.getImageData(0,0,c.width,c.height),d=im.data;let lo=255,hi=0;
  for(let i=0;i<d.length;i+=4){const v=d[i]*.299+d[i+1]*.587+d[i+2]*.114;d[i]=v;if(v<lo)lo=v;if(v>hi)hi=v}
  const k=255/Math.max(1,hi-lo);for(let i=0;i<d.length;i+=4){const v=Math.min(255,Math.max(0,(d[i]-lo)*k*1.15-10));d[i]=d[i+1]=d[i+2]=v}
  x.putImageData(im,0,0);return c}
function readBarcode(cv){

  }catch(e){return null}
}
function parseQty(s){const m=String(s).toLowerCase().replace(/(\d),(\d)/g,"$1.$2").match(/(\d+(?:\.\d+)?)\s*(кг|kg|гр|г|g|мл|ml|л|l)(?![a-zа-я])/);if(!m)return 0;let v=+m[1];if(/^(кг|kg|л|l)$/.test(m[2]))v*=1000;return v>0&&v<=5000?Math.round(v):0}
async function offLookup(code){
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),9000);
  try{
    const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_ru,generic_name_ru,brands,quantity,nutriments`,{signal:ctl.signal});
    const j=await r.json();if(j.status!==1||!j.product)return null;const p=j.product,nu=p.nutriments||{};

    return {n,k100:k!=null&&k>0?Math.round(k*10)/10:"",g:/мл|ml|литр|\b[lL]\b/i.test(p.quantity||"")?0:parseQty(p.quantity||"")};

function parseLabel(raw){
  let t=raw.toLowerCase().replace(/\s+/g," ").replace(/(\d) ?, ?(\d)/g,"$1.$2");
  t=t.replace(/kcal|ккал|kкал|ккaл|kkал|kkal|ккал\./g,"ккал").replace(/kj|кдж|kдж|кдж\./g,"кдж");
  // Значение без понятной базы нельзя переносить в поле «на 100 г».
  const portion=/порци[а-яё]*/.test(t);
  const grams=t.match(/порци[а-яё]*\s*[:(–-]?\s*(\d+(?:\.\d+)?)\s*(?:грамм[а-я]*|гр|г)(?![а-я])/);
  const serving=grams?Number(grams[1]):0;
  const perHundred=/(?:на|в|ценность)\s+100\s*(?:грамм[а-я]*|гр|г)(?![а-я])|100\s*(?:грамм[а-я]*|гр|г)\s+продукт/.test(t);
  const values=[...new Set(Array.from(t.matchAll(/(?:^|[^\d.,])(\d+(?:\.\d+)?)\s*ккал/g),m=>Number(m[1])))];
  let k=0;
  if(values.length===1){
    if(portion&&serving>0&&serving<=5000&&(!perHundred||serving===100))k=values[0]*100/serving;
    else if(!portion&&perHundred)k=values[0];
  }
  const mass=t.match(/(?:масса\s+нетто|вес(?:\s+нетто)?|нетто)\s*[:=–-]?\s*(\d+(?:\.\d+)?\s*(?:кг|гр|г|kg|g))(?![a-zа-я])/);
  return {k100:k>0&&k<=950?Math.round(k*10)/10:0,g:mass?parseQty(mass[1]):serving<=5000?serving:0,serving,portion};

}
let labelQueue=Promise.resolve();
function readLabel(img){
  const task=labelQueue.then(()=>recognizeLabel(img));
  labelQueue=task.catch(()=>{});
  return task;
}
async function recognizeLabel(img){
  await loadScript("scan/tesseract.min.js");
  if(!ocrW){
    const base=new URL("scan/",location.href).href;
    ocrW=await Tesseract.createWorker("rus",1,{workerPath:base+"worker.min.js",corePath:base,langPath:base.replace(/\/$/,""),gzip:true});
  }
  await ocrW.setParameters({tessedit_pageseg_mode:"3"});
  const {data}=await ocrW.recognize(toCanvas(img,2000),{},{text:true,blocks:true});
  const r=parseLabel(data.text||"");r.n=guessName(data);
  r.weights=r.g?[r.g]:[];
  {
    const crop=document.createElement("canvas");
    const sourceWidth=Math.max(1,Math.round(img.naturalWidth*.56));
    const scale=Math.min(2,2800/Math.max(sourceWidth,img.naturalHeight));
    crop.width=Math.max(1,Math.round(sourceWidth*scale));
    crop.height=Math.max(1,Math.round(img.naturalHeight*scale));
    crop.getContext("2d").drawImage(img,(img.naturalWidth-sourceWidth)/2,0,sourceWidth,img.naturalHeight,0,0,crop.width,crop.height);
    await ocrW.setParameters({tessedit_pageseg_mode:"11"});
    const retry=await ocrW.recognize(contrast(crop),{},{text:true,blocks:true}).catch(()=>null);
    if(!retry)return r;
    const second=retry.data;
    const extra=parseLabel(second.text||"");
    if(r.k100&&extra.k100&&r.k100!==extra.k100)r.k100=0;
    else if(r.portion!==extra.portion){
      r.k100=r.portion?r.k100:extra.k100;
    }else r.k100 ||= extra.k100;
    if(extra.g&&!r.weights.includes(extra.g))r.weights.push(extra.g);
    r.n=betterLabelName(r.n,guessName(second));
  }
  return r;
}
async function startScan(file,more=false){
  const previous=more?scan:null;
  goal("scan");
  if(!more&&tab!=="add")addMeal=suggestedMeal()

  if(scan&&scan.url)URL.revokeObjectURL(scan.url);
  scan={url:URL.createObjectURL(file),status:"Считываем данные с упаковки…",n:previous?$("#fn").value.trim():"",k100:previous?+$("#k100").value||"":"",g:previous?+$("#grams").value||"":"",src:"",code:previous?.code||"",weights:previous?.weights?.slice()||[],edited:{...previous?.edited}};pick=null;go("scan");
  const job=scan;
  // Не блокируем ручной ввод, даже если движок OCR на устройстве завис.
  const watchdog=setTimeout(()=>{
    if(scan!==job||!job.status)return;
    job.cancelled=true;
    job.status="";
    job.src="Распознавание заняло слишком много времени. Введите название, калории и порцию вручную.";

    if(job.cancelled)return;

    if(code){
      if(job.code&&job.code!==code){
        job.src="На фото другой штрихкод. Снимите ту же упаковку.";
        return;
      }
      job.code=code;
      const mine=(S.my||[]).find(x=>x.code===code);
      const product=mine||await offLookup(code).catch(()=>null);
      if(job.cancelled)return;
      if(product){
        if(!job.edited.fn)job.n=betterLabelName(job.n,product.n);
        if(!job.edited.k100)job.k100 ||= product.k100||"";
        if(!mine&&product.g&&!job.weights.includes(product.g))job.weights.push(product.g);
      }
    }
    const label=await readLabel(img);

    if(!job.edited.fn)job.n=betterLabelName(job.n,label.n);
    if(label.k100&&!job.edited.k100)job.k100=label.k100;
    job.weights=[...new Set([...job.weights,...(label.weights||[])])];
    job.src=[!job.n&&"Название не прочитано. Добавьте фото лицевой стороны или впишите название.",!job.k100&&"Уточните калорийность на 100 г по этикетке."].filter(Boolean).join(" ")||"Проверьте данные и укажите, сколько съели.";

  }

function hasFood(t){t=t.toLowerCase();return FOOD_WORDS.some(w=>new RegExp("(^|[^а-яё])"+w).test(t))}
function niceCase(t){return t===t.toUpperCase()?t.charAt(0)+t.slice(1).toLowerCase():t}
const ingredientText=/без\s+[а-яё]|не содержит|содержит|аллерген|консервант|усилител|антибиотик|[со]?став\s*[:：]?\s*молоко|остав\b|нормализован|пастеризованное молоко,|закваск|подсластител|стабилизатор/i;
const productStart=/^(?:[её]жики|котлет[аы]|тефтели|гуляш|суп|рагу|каша|плов|салат|запеканка|пельмени|вареники|йогурт|кефир|творог|молоко|сыр|сок|хлеб|шоколад|печенье|мороженое)(?:\s|$)/i;
function betterLabelName(current="",next=""){
  function rank(name){
    if(!name||ingredientText.test(name))return 0;
    return (productStart.test(name)?100:1)+(/\s(?:с|со)\s/i.test(name)?10:0);
  }
  if(rank(next)>rank(current))return next;
  return rank(current)?current:"";
}
function guessName(data){
  // Название ставим, только если в крупной чёткой строке есть слово про еду. Иначе поле пустое: лучше пусто, чем мусор.
  const bad=/ценност|состав|белк|жир|углев|масс|срок|хран|изготов|ккал|кдж|гост|претенз|адрес|вернём|продукт готов|число|месяц|рекоменд|разогре|упаков|изделия|блюда/i;
  const textLines=(data.text||"").split(/\n/).map(t=>t.replace(/^[^А-ЯЁа-яё]+/,"").replace(/\s+\d+(?:[.,]\d+)?\s*г\.?$/i,"").trim()).filter(t=>t.length>=2);

  for(const [i,line] of textLines.entries()){
    const subtitle=/^(?:из|с|со)\s+[а-яё]/i.test(textLines[i+1]||"");
    if(!productStart.test(line)&&!(subtitle&&hasFood(line)))continue;
    if(ingredientText.test(line)||bad.test(line)||line.length>55)continue;
    let name=line;
    for(const next of textLines.slice(i+1,i+6)){
      if(/^(?:из|с|со|и)\s+[а-яё]/i.test(next)&&!bad.test(next)&&!ingredientText.test(next)&&name.length+next.length<80){
        name+=" "+next;
      }else if(next.length>2)break;
    }
    return name[0].toUpperCase()+name.slice(1).toLowerCase();
  }
  return "";
}

function progress(){return order?Math.max(0,Math.min(1,(Date.now()-order.start)/(TRIP_SEC*1000))):0}

// Маршрут объезжает точку «Вы», как в логотипе.
const COURIER_ROUTE=[[20,120],[90,120],[120,190],[250,190],[280,120],[350,120]];
const ROUTE_START=.5, ROUTE_END=.97;

function updateTrack(){
  const pr=progress();
  const si=pr<.12?0:pr<.35?1:pr<ROUTE_START?2:pr<ROUTE_END?3:4;
  const left=Math.max(0,Math.ceil((order.start+TRIP_SEC*1000-Date.now())/1000));
  $("#trackTimer").textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
  const stage=$("#trackStage");
  if(stage.textContent===STEPS[si])return;
  stage.textContent=STEPS[si];
  document.querySelectorAll(".steps li").forEach((step,index)=>{
    step.classList.toggle("done",index<si);
    step.classList.toggle("now",index===si);
  });
}

function animateCourier(){
  const distances=[0];
  for(let i=1;i<COURIER_ROUTE.length;i++){
    const [x,y]=COURIER_ROUTE[i], [prevX,prevY]=COURIER_ROUTE[i-1];
    distances.push(distances[i-1]+Math.hypot(x-prevX,y-prevY));
  }
  const total=distances.at(-1);
  const frames=COURIER_ROUTE.map(([x,y],i)=>({
    transform:`translate(${x}px, ${y}px)`,
    offset:ROUTE_START+(ROUTE_END-ROUTE_START)*distances[i]/total
  }));
  frames.unshift({...frames[0],offset:0});
  frames.push({...frames.at(-1),offset:1});
  const duration=TRIP_SEC*1000;
  const animation=$("#courierMarker").animate?.(frames,{duration,easing:"linear",fill:"both"});
  if(animation)animation.currentTime=progress()*duration;
}

/* ---------- Итоги ---------- */
function renderWeek(N){
  const date=new Date();
  date.setHours(12,0,0,0);
  const label=new Intl.DateTimeFormat("ru-RU",{weekday:"short",day:"2-digit",month:"2-digit"});
  const days=Array.from({length:7},()=>{
    const key=dk(date);
    const day={key,label:label.format(date),eaten:eatenOn(key),saved:mimoOn(key),logged:!!S.log[key]?.length};
    date.setDate(date.getDate()-1);
    return day;
  });
  const loggedDays=days.filter(day=>day.logged).length;
  const max=Math.max(N*1.12,...days.map(day=>day.eaten));
  const percent=amount=>(amount/max*100).toFixed(2)+"%";
  return `<section class="sheet" aria-labelledby="week-title">
     <h2 id="week-title">Последние 7 дней</h2>
     <p class="note week-note">Дни с записями о еде · <b>${loggedDays} из 7</b></p>
     <table class="week" aria-labelledby="week-title" aria-describedby="week-units" style="--week-limit:${percent(N)}">
       <thead><tr><th scope="col">День</th><th scope="col">Съедено</th><th scope="col">Мимо рта</th></tr></thead>
       <tbody>${days.map((day,index)=>{
         const within=Math.min(day.eaten,N);
         const excess=day.eaten-within;
         return `<tr${index===0?' class="week-today"':""}>
           <th scope="row">${index===0?"<strong>Сегодня</strong>":""}<time datetime="${day.key}">${day.label}</time></th>
           <td>${day.logged?`<button class="week-link" data-open-day="${day.key}" aria-label="Открыть дневник за ${day.label}, съедено ${fmt(day.eaten)} ккал"><span class="week-amount"><b>${fmt(day.eaten)}</b>${excess?`<span class="week-over" aria-label="${fmt(excess)} ккал сверх нормы">+${fmt(excess)}</span>`:""}</span>
             <span class="week-track" aria-hidden="true"><i style="width:${percent(within)}"></i>${excess?`<i class="week-over" style="width:${percent(excess)}"></i>`:""}</span></button>`:'<span class="week-empty">Нет записей</span>'}</td>
           <td>${day.saved?`<button class="week-link week-saved" data-open-day="${day.key}" aria-label="Открыть дневник за ${day.label}, в виртуальных заказах ${fmt(day.saved)} ккал"><b>${fmt(day.saved)}</b></button>`:'<span class="week-empty" aria-label="Без виртуальных заказов">—</span>'}</td>
         </tr>`;
       }).join("")}</tbody>
     </table>
     <div class="week-key"><span class="week-reference">Норма ${fmt(N)} ккал</span><span class="week-excess">Сверх нормы</span></div>
     <p class="note week-note" id="week-units">Все значения в ккал. «Мимо рта» — виртуальные заказы.</p>
   </section>`;
}

  if(b.id==="sayGo")return saySubmit();
  if(b.dataset.ptog){const x=photo.sel[+b.dataset.ptog];x.on=!x.on;$("#prows").innerHTML=photoRows();return photoCta()}
  if(b.dataset.padd){photo.sel.push({i:+b.dataset.padd,g:FOODS[+b.dataset.padd][2],on:true});photo.q="";$("#pq").value="";$("#pres").innerHTML="";$("#prows").innerHTML=photoRows();return photoCta()}
  if(b.id==="addPhoto"){const L=photo.sel.filter(x=>x.on&&x.g>0);if(!L.length)return toast("Отметьте хотя бы одно блюдо");addMeal=+$("#ml").value;const day=curDay();S.log[day]=S.log[day]||[];
    L.forEach(x=>{const f=FOODS[x.i];S.log[day].push({n:f[0],k:Math.round(f[1]*x.g/100),g:x.g,m:addMeal,k100:f[1]})});goal("add_food");markDay();pick=null;q="";if(save())toast(`Записано: ${L.length} ${plural(L.length,"блюдо","блюда","блюд")}`);return go("diary")}
  if(b.dataset.crave){goal("crave_tile");const id=b.dataset.crave;if(order)return go("track");if(!cart[id])cart[id]=1;return go("cart")}
  if(b.dataset.cat){cat=b.dataset.cat;return render()}
  if(b.dataset.add||b.dataset.dec){
    const id=b.dataset.add||b.dataset.dec;
    const count=(cart[id]||0)+(b.dataset.add?1:-1);
    if(count>0)cart[id]=count;
    else delete cart[id];
    if(tab==="menu")toast(b.dataset.add?"Добавлено в заказ":"Убрано из заказа");
    render();
    if(e.detail===0){
      const control=b.dataset.dec&&count>0?"dec":"add";
      (document.querySelector(`[data-${control}="${id}"]`)||document.querySelector(".step button, .dish-step button"))?.focus({preventScroll:true});
    }
    return;
  }
  if(b.dataset.tab){return go(b.dataset.tab==="menu"&&order?"track":b.dataset.tab)}
  if(b.dataset.go){return go(b.dataset.go==="menu"&&order?"track":b.dataset.go)}
  if(b.id==="diarySearch"||b.dataset.addmeal){
    wholeDaySearch=b.id==="diarySearch";
    addMeal=wholeDaySearch?suggestedMeal():+b.dataset.addmeal;
    pick=null;
    q="";
    go("add");
    if(wholeDaySearch)$("#q").focus();
    return;
  }
  if(b.dataset.openDay){
    viewDay=b.dataset.openDay===dk()?null:b.dataset.openDay;
    go("diary");
    const heading=$(".daynav h1");
    heading.tabIndex=-1;
    heading.focus({preventScroll:true});
    return;
  }
  if(b.dataset.pick){pick=b.dataset.pick==="custom"?"custom":+b.dataset.pick;return go("add")}
  if(b.dataset.back){pick=null;return go("add")}
  if(b.dataset.g){const g=$("#grams");g.value=b.dataset.g;g.dispatchEvent(new Event("input",{bubbles:true}));return}
  if(b.dataset.delm){const i=S.orders.findIndex(o=>o.d==b.dataset.delm);if(i<0)return;const [x]=S.orders.splice(i,1);save();render();undo=()=>{S.orders.splice(i,0,x);save();render()};return toast("Заказ удалён из статистики",true)}
  if(b.dataset.delw){const i=S.weights.findIndex(v=>v.d===b.dataset.delw);if(i<0)return;const [x]=S.weights.splice(i,1);save();render();undo=()=>{S.weights.splice(i,0,x);S.weights.sort((a,c)=>a.d<c.d?-1:1);save();render()};return toast(`Удалено: ${fmt1(x.w)} кг`,true)}
  if(b.dataset.cup){S.cup=[200,250,300,500][([200,250,300,500].indexOf(S.cup||250)+1)%4];save();return render()}
  if(b.dataset.del){const day=curDay(),i=+b.dataset.del,[x]=S.log[day].splice(i,1);save();render();undo=()=>{S.log[day].splice(i,0,x);save();render()};return toast(`Удалено: ${x.n}`,true)}
  if(b.id==="undo"){const f=undo;undo=null;$("#toast").hidden=true;if(f)f();return}
  if(b.dataset.day){const d=new Date((viewDay||dk())+"T12:00:00");d.setDate(d.getDate()+(+b.dataset.day));const k=dk(d);viewDay=k>=dk()?null:k;return render()}
  if((b.id==="addFood"||b.id==="addScan"||b.id==="addCustom")&&$("#ml"))addMeal=+$("#ml").value;
  if(b.id==="addFood"){const f=FOODS[pick];const g=+$("#grams").value||0,k1=+$("#k100").value||0;if(g<=0)return toast("Укажите граммы");if(k1<=0)return toast("Укажите калории на 100 г");if(k1!==f[1]){S.kfix=S.kfix||{};S.kfix[f[0]]=k1;f[1]=k1}return addEntry(f[0],k1*g/100,g,k1)}
  if(b.id==="stopScan"){if(scan){scan.cancelled=true;scan.status="";scan.src="Введите данные с упаковки вручную.";renderScan()}return}
  if(b.id==="addScan"){const n=$("#fn").value.trim()||"Продукт",k1=+$("#k100").value||0,g=+$("#grams").value||0;if(k1<=0)return toast("Укажите калории на 100 г");if(g<=0)return toast("Укажите граммы");rememberFood(n,k1,g,scan&&scan.code);return addEntry(n,k1*g/100,g,k1)}
  if(b.dataset.edit){editIdx=+b.dataset.edit;return go("entry")}
  if(b.id==="saveEntry"){const e=S.log[curDay()][editIdx];
    if(e.g){const k1=+$("#k100").value||0,g=+$("#grams").value||0;if(k1<=0||g<=0)return toast("Проверьте калории и граммы");e.k100=k1;e.g=g;e.k=Math.round(k1*g/100)}
    else{const k=+$("#ck").value||0;if(k<=0)return toast("Укажите калории");e.k=Math.round(k)}
    e.n=$("#fn").value.trim()||e.n;e.m=+$("#em").value;
    if(save())toast("Сохранено");return go("diary")}
  if(b.id==="delEntry"){const day=curDay(),i=editIdx,[x]=S.log[day].splice(i,1);save();go("diary");undo=()=>{S.log[day].splice(i,0,x);save();render()};return toast(`Удалено: ${x.n}`,true)}
  if(b.id==="addCustom"){const n=$("#cn").value.trim()||"Своё блюдо";const k=+$("#ck").value||0;if(k<=0)return toast("Укажите калории");return addEntry(n,k,0)}
  if(b.id==="saveProfile"){
    const sex=$("#sex").value,age=+$("#age").value,h=+$("#h").value,w=+$("#w").value,act=+$("#act").value,goal=+$("#goal").value;
    if(!(age>10&&h>100&&w>30))return toast("Проверьте возраст, рост и вес");
    const bmr=10*w+6.25*h-5*age+(sex==="m"?5:-161);
    const n=Math.max(sex==="m"?1500:1200,Math.round((bmr*ACT[act][1]+GOALS[goal][1])/10)*10);
    let tw=goal===1?w:+$("#tw").value;if(goal!==1&&!(tw>30&&tw<300))return toast("Укажите желаемый вес");
    if(goal===0&&tw>=w)return toast("Для похудения желаемый вес должен быть меньше текущего");if(goal===2&&tw<=w)return toast("Для набора желаемый вес должен быть больше текущего");
    const first=!S.profile;S.profile={sex,age,h,w,act,goal,norm:n,tw,w0:(S.profile&&S.profile.w0)||w};logWeight(w);save();return go(first||goal!==1?"plan":"diary");
  }
  if(b.id==="saveGoal"){const p=S.profile,g=+$("#gGoal").value,cw=curW()||p.w;
    let tw=g===1?cw:+String($("#gTw").value).replace(",",".");if(g!==1&&!(tw>30&&tw<300))return toast("Укажите желаемый вес");
    if(g===0&&tw>=cw)return toast("Для похудения желаемый вес должен быть меньше текущего");if(g===2&&tw<=cw)return toast("Для набора желаемый вес должен быть больше текущего");
    const nn=+$("#gNorm").value;if(!(nn>=800&&nn<=6000))return toast("Норма должна быть от 800 до 6 000 ккал");
    p.norm=Math.round(nn);p.goal=g;p.tw=tw;p.w=cw;save();goal("goal_set");return go(g!==1?"plan":"diary");
  }
  if(b.id==="helloGo"){S.hello=1;save();return go("setup")}
  if(b.id==="skipProfile"){S.skippedProfile=true;save();return go("diary")}
  if(b.id==="streak"){const n=streak();return toast(`Вы ${n} ${plural(n,"день","дня","дней")} подряд ведёте дневник. Кто записывает еду каждый день, худеет заметно успешнее. Не прерывайте серию!`)}
  if(b.id==="backup"||b.id==="emergencyBackup")return downloadDiary(unreadableDiary?storedDiary:JSON.stringify(S));
  if(b.id==="retrySave"){if(save())toast("Дневник сохранён");return}
  if(b.id==="cartBtn")return go("cart");
  if(b.id==="checkout")return startOrder();
  if(b.id==="reset"){if(b.dataset.sure){const next=emptyDiary();if(!save(next))return;S=next;cart={};viewDay=null;order=null;undo=null;applyFoodHistory();return go("setup")}b.dataset.sure=1;b.textContent="Нажмите ещё раз, чтобы стереть всё";}
});

setInterval(()=>{
  if(!order)return;
  if(progress()>=1){finishOrder();return}
  if(tab==="track")updateTrack();
},1000);

if(order)tab="track";else if(!S.profile&&!S.skippedProfile)tab=S.hello?"setup":"hello";
showStorageMessage();
render();
document.body.classList.remove("booting");
if(location.hostname==="appassets.androidplatform.net")window.prompt("mimo.ready","");
trackPilotVisit();
window.addEventListener("pageshow",trackPilotVisit);
window.addEventListener("online",syncPilotGoals);
document.addEventListener("visibilitychange",trackPilotVisit);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
