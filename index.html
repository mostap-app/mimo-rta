<style>
/* Layout: one-column phone app shell, sticky header, bottom tab bar, screens swapped in place */
:root{
  --bg:#fff6ee; --surface:#ffffff; --ink:#2b1a12; --muted:#7a675b; --line:#f3e3d5;
  --accent:#f4511e; --accent-ink:#ffffff; --accent-text:#d9400f; --save:#1f9d6b; --save-text:#157a52; --save-soft:#e1f5ea; --warm:#ffb400;

  --body:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.app{max-width:480px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}

.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.04em}
.logo svg{width:34px;height:34px;flex:none}
.streak{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:24px;line-height:1.15;font-weight:700}
h2{font-size:17px;font-weight:700}
.muted{color:var(--muted)}
.lead{margin:6px 0 0;color:var(--muted)}
.saved-strip{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--save-soft);border-radius:16px;padding:12px 14px}
.kpi .v{font-family:var(--display);font-weight:700;font-size:19px;color:var(--save-text);font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.dish{background:var(--surface);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;text-align:left;border:1px solid var(--line)}
.dish .pic{aspect-ratio:1/0.82;max-width:100%;display:grid;place-items:center;font-size:58px;background:var(--plate)}
.dish .pic img{width:100%;height:100%;object-fit:cover;display:block}
.dish .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.dish .name{font-weight:600;line-height:1.25}
.dish .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:6px}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.kcal{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.add{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:20px;line-height:1;display:grid;place-items:center;font-weight:700}
.qty{min-width:36px;height:36px;padding:0 10px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px}
.cartbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.ava{width:46px;height:46px;border-radius:50%;background:var(--warm);display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#3a2400}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}

.steps li.done{color:var(--ink)}
.steps li.done .dot{background:var(--save);border-color:var(--save)}
.steps li.now{color:var(--ink);font-weight:600}
.steps li.now .dot{border-color:var(--accent);background:var(--accent);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(224,70,110,.2)}}
.reward{text-align:center;padding-top:6px}
.reward .badge{width:140px;height:140px;margin:6px auto 10px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}

.equiv{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left}

.photo-btn{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border-radius:18px;border:1.5px dashed var(--line);background:var(--surface);font-weight:700;cursor:pointer;min-height:52px}
.photo-btn svg{width:22px;height:22px}

.shot{width:100%;max-height:300px;object-fit:cover;border-radius:20px;margin-top:12px;display:block;background:var(--plate)}
.status{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--muted);font-weight:600}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite;flex:none}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const pic=d=>PH[d.id]?`<img src="${PH[d.id]}" alt="" loading="lazy" data-e="${d.e}" onerror="this.parentNode.textContent=this.dataset.e">`:d.e;
const dish=id=>DISHES.find(x=>x.id==id);
const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString("ru-RU");
const dk=d=>{d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function plural(n,a,b,c){n=Math.abs(n)%100;const m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m==1)return a;return c}

let S=load();
let photo=null, ortSess=null, EM=null;
let cat="Всё", cart={}, tab="diary", order=S.active||null, addMeal=0, pick=null, q="";

function load(){
  const d={profile:null,log:{},orders:[],days:[],active:null};
  try{
    let s=JSON.parse(localStorage.getItem("mimorta")||"null");
    if(!s){const old=JSON.parse(localStorage.getItem("sytglazami")||"null");if(old)s={orders:(old.orders||[]).map(o=>({...o,day:o.day||dk(new Date(o.d))})),days:old.days||[],active:old.active||null,lastReward:old.lastReward}}
    return s?Object.assign(d,s):d;
  }catch(e){return d}
}
function save(){try{localStorage.setItem("mimorta",JSON.stringify(S))}catch(e){}}
function markDay(){const t=dk();if(!S.days.includes(t))S.days.push(t)}
function streak(){
  const set=new Set(S.days);let n=0,d=new Date();
  if(!set.has(dk(d)))d.setDate(d.getDate()-1);
  while(set.has(dk(d))){n++;d.setDate(d.getDate()-1)}
  return n;
}
function norm(){return S.profile?S.profile.norm:2000}
function eatenOn(day){return (S.log[day]||[]).reduce((a,x)=>a+x.k,0)}
function mimoOn(day){return S.orders.filter(o=>o.day===day).reduce((a,o)=>a+o.k,0)}
function totals(){return S.orders.reduce((a,o)=>({k:a.k+o.k,p:a.p+o.p,n:a.n+1}),{k:0,p:0,n:0})}
function cartInfo(){let q=0,p=0,k=0;for(const id in cart){const d=dish(id);q+=cart[id];p+=d.p*cart[id];k+=d.k*cart[id]}return{q,p,k}}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,1800)}
function go(t){tab=t;window.scrollTo(0,0);render()}

function render(){
  const s=streak();$("#streak").textContent=`${s} ${plural(s,"день","дня","дней")} подряд`;
  const group={diary:"diary",add:"diary",photo:"diary",setup:"diary",menu:"menu",cart:"menu",track:"menu",reward:"menu",me:"me"}[tab];
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===group));
  const ci=cartInfo();
  $("#cartbar").hidden=!(tab==="menu"&&ci.q>0);

/* ---------- Распознавание по фото (в телефоне, без сервера) ---------- */
function embM(){if(EM)return EM;const raw=atob(EMBD.b),n=EMBD.s.length,M=new Float32Array(n*512);for(let i=0;i<n*512;i++){let v=raw.charCodeAt(i);if(v>127)v-=256;M[i]=v*EMBD.s[(i/512)|0]}return EM=M}
async function loadModel(){
  if(ortSess)return ortSess;
  if(!window.ort)throw new Error("движок распознавания не загрузился");
  ort.env.wasm.wasmPaths=new URL("./",location.href).href;ort.env.wasm.numThreads=1;
  setPhotoStatus("Загружаю модель распознавания (23 МБ, один раз за сеанс)…");
  const parts=await Promise.all(["model.part1.wasm","model.part2.wasm"].map(u=>fetch(u).then(r=>{if(!r.ok)throw new Error("файл модели "+r.status);return r.arrayBuffer()})));
  const buf=new Uint8Array(parts[0].byteLength+parts[1].byteLength);buf.set(new Uint8Array(parts[0]),0);buf.set(new Uint8Array(parts[1]),parts[0].byteLength);
  setPhotoStatus("Запускаю модель…");
  ortSess=await ort.InferenceSession.create(buf,{executionProviders:["wasm"]});
  return ortSess;
}
function setPhotoStatus(t){if(photo){photo.status=t;if(tab==="photo")renderPhoto()}}
async function recognize(img){
  const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");x.imageSmoothingQuality="high";
  const w=img.naturalWidth,h=img.naturalHeight,s=Math.min(w,h);x.drawImage(img,(w-s)/2,(h-s)/2,s,s,0,0,256,256);
  const d=x.getImageData(0,0,256,256).data,f=new Float32Array(3*65536);
  for(let i=0;i<65536;i++){f[i]=d[i*4]/255;f[65536+i]=d[i*4+1]/255;f[131072+i]=d[i*4+2]/255}
  const out=await ortSess.run({pixel_values:new ort.Tensor("float32",f,[1,3,256,256])});
  const v=out.image_embeds.data;let nr=0;for(let j=0;j<512;j++)nr+=v[j]*v[j];nr=Math.sqrt(nr);
  const M=embM(),n=EMBD.s.length,sc=[];
  for(let r=0;r<n;r++){let t=0;for(let j=0;j<512;j++)t+=M[r*512+j]*v[j];sc.push(t/nr)}
  const food=sc.slice(0,FOODS.length),neg=Math.max(...sc.slice(FOODS.length));
  const idx=food.map((_,i)=>i).sort((a,b)=>food[b]-food[a]).slice(0,3);
  const ex=food.map(z=>Math.exp((z-food[idx[0]])*100)),Z=ex.reduce((a,b)=>a+b,0);
  return {top:idx.map(i=>({i,p:Math.max(1,Math.round(ex[i]/Z*100))})),notFood:neg>food[idx[0]]};
}

  photo={url:URL.createObjectURL(file),status:"Смотрю на фото…",result:null,err:null};pick=null;go("photo");

    const img=new Image();img.src=photo.url;await img.decode();

function mapSVG(pr){

  const seg=[];let L=0;for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);L+=d}
  let t=Math.min(pr/.97,1)*L,x=pts[0][0],y=pts[0][1];

   <circle cx="20" cy="120" r="9" fill="var(--warm)"/>
   <circle cx="${x}" cy="${y}" r="15" fill="var(--warm)" opacity=".3"/><circle cx="${x}" cy="${y}" r="9" fill="var(--warm)"/>
  </svg>`;
}

function renderMe(){
  const t=totals(), N=norm();
  const days=[];const d=new Date();d.setDate(d.getDate()-6);
  const wd=["вс","пн","вт","ср","чт","пт","сб"];
  let max=N;for(let i=0;i<7;i++){const k=dk(d);const e=eatenOn(k),m=mimoOn(k);max=Math.max(max,e+m);days.push({w:wd[d.getDay()],e,m});d.setDate(d.getDate()+1)}
  $("#view").innerHTML=`
   <h1>Ваши итоги</h1>
   <div class="saved-strip">
     <div class="kpi"><div class="l">Мимо рта</div><div class="v">${fmt(t.k)} ккал</div></div>
     <div class="kpi"><div class="l">Сэкономлено</div><div class="v">${fmt(t.p)} ₽</div></div>
     <div class="kpi"><div class="l">Заказов</div><div class="v">${t.n}</div></div>
     <div class="kpi"><div class="l">≈ жира</div><div class="v">${fmt(t.k/7.7)} г</div></div>
   </div>
   <div class="sheet"><h2>Неделя</h2>
     <div class="week">${days.map(x=>`<div class="wd"><span class="muted">${x.w}</span><div class="bar" aria-hidden="true"><i class="${x.e>N?"o":""}" style="width:${(x.e/max*100).toFixed(1)}%"></i><i class="m" style="width:${(x.m/max*100).toFixed(1)}%"></i></div><span>${x.e||x.m?`${fmt(x.e)}${x.m?` / <span style="color:var(--save-text)">−${fmt(x.m)}</span>`:""}`:`<span class="muted">—</span>`}</span></div>`).join("")}</div>
     <div class="legend"><span style="--c:var(--ink)">Съедено</span><span style="--c:var(--accent)">Сверх нормы</span><span style="--c:var(--save)">Мимо рта</span></div>
   </div>
   <div class="sheet"><div class="tot"><span class="muted">Дневная норма</span><span>${fmt(N)} ккал</span></div><button class="ghost" data-go="setup">${S.profile?"Изменить данные":"Рассчитать норму"}</button></div>
   <details class="sheet credits"><summary>Фото блюд и модель распознавания</summary><p class="note">Распознавание еды: модель MobileCLIP-S0 (Apple), <a href="MOBILECLIP_LICENSE.txt" target="_blank" rel="noopener">лицензия</a>. Фото блюд: Wikimedia Commons и Шедеврум.</p><ol>${CREDITS.map(c=>`<li>${c.d}: <a href="${c.u}" target="_blank" rel="noopener">${esc(c.a)}</a>, ${c.l}</li>`).join("")}</ol></details>
   <button class="ghost" id="reset">Сбросить все данные</button>`;
}

/* ---------- События ---------- */
document.addEventListener("change",e=>{if(e.target.id==="photoIn"&&e.target.files&&e.target.files[0])startPhoto(e.target.files[0])});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){q=e.target.value;$("#res").innerHTML=foodRows()}
  if(e.target.id==="grams"){const f=FOODS[pick];$("#kc").textContent=fmt(f[1]*(+e.target.value||0)/100)+" ккал"}
});
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.cat){cat=b.dataset.cat;return render()}
  if(b.dataset.add){cart[b.dataset.add]=(cart[b.dataset.add]||0)+1;if(tab==="menu")toast("Добавлено. Аппетит растёт, вес нет.");return render()}
  if(b.dataset.dec){if(--cart[b.dataset.dec]<=0)delete cart[b.dataset.dec];return render()}
  if(b.dataset.tab){return go(b.dataset.tab==="menu"&&order?"track":b.dataset.tab)}
  if(b.dataset.go){return go(b.dataset.go==="menu"&&order?"track":b.dataset.go)}
  if(b.dataset.addmeal){addMeal=+b.dataset.addmeal;pick=null;q="";return go("add")}
  if(b.dataset.pick){pick=b.dataset.pick==="custom"?"custom":+b.dataset.pick;return go("add")}
  if(b.dataset.back){pick=null;return go("add")}
  if(b.dataset.g){const g=$("#grams");g.value=b.dataset.g;g.dispatchEvent(new Event("input",{bubbles:true}));return}
  if(b.dataset.del){const day=dk();S.log[day].splice(+b.dataset.del,1);save();return render()}
  if(b.id==="addFood"){const f=FOODS[pick];const g=+$("#grams").value||0;if(g<=0)return toast("Укажите граммы");return addEntry(f[0],f[1]*g/100,g)}
  if(b.id==="addCustom"){const n=$("#cn").value.trim()||"Своё блюдо";const k=+$("#ck").value||0;if(k<=0)return toast("Укажите калории");return addEntry(n,k,0)}
  if(b.id==="saveProfile"){
    const sex=$("#sex").value,age=+$("#age").value,h=+$("#h").value,w=+$("#w").value,act=+$("#act").value,goal=+$("#goal").value;
    if(!(age>10&&h>100&&w>30))return toast("Проверьте возраст, рост и вес");
    const bmr=10*w+6.25*h-5*age+(sex==="m"?5:-161);
    const n=Math.max(sex==="m"?1500:1200,Math.round((bmr*ACT[act][1]+GOALS[goal][1])/10)*10);
    S.profile={sex,age,h,w,act,goal,norm:n};save();toast("Ваша норма: "+fmt(n)+" ккал в день");return go("diary");
  }
  if(b.id==="skipProfile"){S.profile={sex:"f",age:35,h:168,w:75,act:1,goal:0,norm:2000};save();return go("diary")}
  if(b.id==="cartBtn")return go("cart");
  if(b.id==="checkout")return startOrder();
  if(b.id==="skip"){order.start=Date.now()-TRIP_SEC*1000*.9;S.active=order;save();return render()}
  if(b.id==="reset"){if(b.dataset.sure){S={profile:null,log:{},orders:[],days:[],active:null};order=null;save();return go("setup")}b.dataset.sure=1;b.textContent="Нажмите ещё раз, чтобы стереть всё";}
});

setInterval(()=>{
  if(!order)return;
  if(progress()>=1){finishOrder();return}
  if(tab==="track")renderTrack();
},1000);

if(order)tab="track";else if(!S.profile)tab="setup";
render();
</script>

</body></html>
