plugins { id 'com.android.application' }
android {
    namespace 'app.mostap.mimorta.preview'
    compileSdk 35
    defaultConfig {
        applicationId 'app.mostap.mimorta'
        manifestPlaceholders = [appLabel: 'Мимо рта']
        minSdk 29
        targetSdk 34
        versionCode 4
        versionName '0.2.1'
    }
    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            versionNameSuffix '-test'
            if (providers.gradleProperty('isolatedTest').isPresent()) {
                applicationIdSuffix '.preview.diaryqa'
                manifestPlaceholders.appLabel = 'Мимо рта · Дневник'
            }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
