plugins { id 'com.android.application' }
android {
    namespace 'app.mostap.mimorta.preview'
    compileSdk 35
    defaultConfig {
        applicationId 'app.mostap.mimorta.preview'
        manifestPlaceholders = [appLabel: 'Мимо рта']
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName '0.2.1-test'
    }
    buildTypes {
        debug {
            if (providers.gradleProperty('isolatedTest').isPresent()) {
                applicationIdSuffix '.qa'
                manifestPlaceholders.appLabel = 'Мимо рта · Тест'
            }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
